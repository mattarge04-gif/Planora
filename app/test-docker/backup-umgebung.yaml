services:
  db:
    image: postgres:18-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_PASSWORD: ${PLANORA_TEST_PW:?Zufaelliges Testpasswort fehlt}
      POSTGRES_DB: planora
    ports: ["127.0.0.1:${PLANORA_TEST_DBPORT:-25432}:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d planora]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes: [pgdata:/var/lib/postgresql]
  backup:
    build:
      context: ../..
      dockerfile: betrieb/backup/Dockerfile
    profiles: [betrieb]
    environment:
      PLANORA_BETRIEB_DB: ${PLANORA_TEST_BETRIEB_DB:?}
      PLANORA_BACKUP_DB: ${PLANORA_TEST_BACKUP_DB:?}
      PLANORA_RELEASE: m1-test
      PLANORA_RECOVERY_EMPFAENGER: ${PLANORA_TEST_RECOVERY_EMPFAENGER:-}
      PLANORA_KONFIGURATION_FILE: /ziel/konfiguration.json
      PLANORA_INVENTAR_FILE: /ziel/inventar.json
      RESTIC_REPOSITORY: /ziel/restic
      RESTIC_PASSWORD: ${PLANORA_TEST_RESTIC_PW:?}
      XDG_CACHE_HOME: /tmp/cache
    volumes:
      - dokumente:/dokumente
      - backup-staging:/staging
      - type: bind
        source: ${PLANORA_TEST_ZIEL:?}
        target: /ziel
volumes:
  pgdata: {}
  dokumente: {}
  backup-staging: {}
